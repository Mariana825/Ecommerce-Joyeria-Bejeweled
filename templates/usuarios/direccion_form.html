{% extends 'base.html' %}
{% block titulo %}{{ titulo }} | Bejeweled{% endblock %}
{% block newsletter %}{% endblock %}

{% block contenido %}
<div class="panel panel-angosto">
    <h1>{{ titulo }}</h1>
    <p class="subtitulo">Necesitamos estos datos para enviarte tu pedido.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primario">Guardar dirección</button>
    </form>
    <div class="enlaces-form">
        <p><a href="{% url 'usuarios:direcciones' %}">Volver a mis direcciones</a></p>
    </div>
</div>
{% endblock %}
