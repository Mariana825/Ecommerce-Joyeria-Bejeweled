{% extends 'base.html' %}
{% block titulo %}Mi perfil | Bejeweled{% endblock %}
{% block newsletter %}{% endblock %}

{% block contenido %}
<div class="panel panel-angosto">
    <h1>Mi perfil</h1>
    <p class="subtitulo">Actualiza tus datos personales.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primario">Guardar cambios</button>
    </form>
    <div class="enlaces-form">
        <p>
            <a href="{% url 'usuarios:direcciones' %}">Mis direcciones</a> ·
            <a href="{% url 'usuarios:historial_pedidos' %}">Mis pedidos</a>
        </p>
    </div>
</div>
{% endblock %}
