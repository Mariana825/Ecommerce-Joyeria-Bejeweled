{% load traducir_tags %}

<section class="seccion-newsletter">
    <div class="contenedor">
        <h2>{{ "Acceso Exclusivo"|traducir:request }}</h2>

        <p>
            {{ "Suscríbete para recibir primero nuestras nuevas colecciones, ofertas exclusivas y contenido sobre el mundo de la joyería fina."|traducir:request }}
        </p>

        <form class="form-newsletter" action="{% url 'productos:newsletter' %}" method="post">
            {% csrf_token %}

            <input type="hidden" name="siguiente" value="{{ request.get_full_path }}">

            <input
                type="email"
                name="email"
                placeholder="{{ 'Tu correo electrónico'|traducir:request }}"
                required
            >

            <button type="submit" class="btn btn-primario">
                {{ "Suscribirse"|traducir:request }}
            </button>
        </form>
    </div>
</section>
